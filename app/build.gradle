plugins {
    id 'com.android.application'
}

android {
    namespace 'com.whatsmyphonenumber.io'
    compileSdk 35

    defaultConfig {
        applicationId 'com.whatsmyphonenumber.io'
        minSdk 22
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Signed with the debug key so the release APK is installable out of the box.
            // Swap in your own signingConfig before publishing anywhere.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
